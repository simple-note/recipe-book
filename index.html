<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 북</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilter()">
                <div class="bg-black text-white font-bold px-3 py-1.5 rounded text-lg">R</div>
                <h1 class="text-xl font-bold tracking-tight">레시피 북</h1>
            </div>
            <button onclick="openModal()" class="bg-black hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1.5">
                <span>+ 레시피 작성</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Search & Filter Section -->
        <div class="mb-8 space-y-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="제목, 재료, 태그 검색..." oninput="filterRecipes()" 
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-black transition">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <!-- Tags Filter Box -->
            <div class="bg-white border border-gray-200 rounded-xl p-4">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">태그 필터 (중복 가능)</span>
                <div id="tagFilterContainer" class="flex flex-wrap gap-2">
                    <span class="text-sm text-gray-400">등록된 태그가 없습니다.</span>
                </div>
            </div>
        </div>

        <!-- Recipe List Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 id="recipeCountText" class="text-sm font-semibold text-gray-500">전체 목록 0개</h2>
        </div>

        <!-- Recipe Grid -->
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Recipes -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden bg-white border border-dashed border-gray-300 rounded-2xl p-12 text-center mt-4">
            <p class="text-gray-500 text-sm mb-4">등록된 레시피가 없거나 검색 결과가 없습니다.</p>
            <button onclick="resetFilter()" class="border border-gray-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition">전체 목록 보기</button>
        </div>
    </main>

    <!-- Recipe Modal (Add / Detail) -->
    <div id="recipeModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl relative">
            <div id="modalAddView">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">새 레시피 작성</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-black">&times;</button>
                </div>
                <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">레시피 제목</label>
                        <input type="text" id="recipeTitle" required placeholder="예: 야채 계란말이" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">소요 시간 및 인분</label>
                        <input type="text" id="recipeMeta" placeholder="예: 15분 · 2인분" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">사진 이미지 URL (선택)</label>
                        <input type="url" id="recipeImage" placeholder="https://images.unsplash.com/..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">간단 소개</label>
                        <input type="text" id="recipeDesc" placeholder="예: 다진 당근과 파가 들어간 맛있는 계란말이" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">태그 (쉼표로 구분)</label>
                        <input type="text" id="recipeTags" placeholder="한식, 반찬, 초간단" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">재료 및 조리 순서</label>
