<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 북</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetFilter()">
                <div class="bg-black text-white font-bold px-3 py-1.5 rounded text-lg">R</div>
                <h1 class="text-xl font-bold tracking-tight">레시피 북</h1>
            </div>
            <button onclick="openModal()" class="bg-black hover:bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center space-x-1.5">
                <span>+ 레시피 작성</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Search & Filter Section -->
        <div class="mb-8 space-y-4">
            <div class="relative">
                <input type="text" id="searchInput" placeholder="제목, 재료, 태그 검색..." oninput="filterRecipes()" 
                    class="w-full bg-white border border-gray-200 rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-black transition">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>

            <!-- Tags Filter Box -->
            <div class="bg-white border border-gray-200 rounded-xl p-4">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-2">태그 필터 (중복 가능)</span>
                <div id="tagFilterContainer" class="flex flex-wrap gap-2">
                    <span class="text-sm text-gray-400">등록된 태그가 없습니다.</span>
                </div>
            </div>
        </div>

        <!-- Recipe List Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 id="recipeCountText" class="text-sm font-semibold text-gray-500">전체 목록 0개</h2>
        </div>

        <!-- Recipe Grid -->
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Recipes -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden bg-white border border-dashed border-gray-300 rounded-2xl p-12 text-center mt-4">
            <p class="text-gray-500 text-sm mb-4">등록된 레시피가 없거나 검색 결과가 없습니다.</p>
            <button onclick="resetFilter()" class="border border-gray-300 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition">전체 목록 보기</button>
        </div>
    </main>

    <!-- Recipe Modal (Add / Detail) -->
    <div id="recipeModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 shadow-xl relative">
            <div id="modalAddView">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">새 레시피 작성</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-black">&times;</button>
                </div>
                <form id="recipeForm" onsubmit="saveRecipe(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">레시피 제목</label>
                        <input type="text" id="recipeTitle" required placeholder="예: 야채 계란말이" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">소요 시간 및 인분</label>
                        <input type="text" id="recipeMeta" placeholder="예: 15분 · 2인분" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">사진 이미지 URL (선택)</label>
                        <input type="url" id="recipeImage" placeholder="https://images.unsplash.com/..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">간단 소개</label>
                        <input type="text" id="recipeDesc" placeholder="예: 다진 당근과 파가 들어간 맛있는 계란말이" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">태그 (쉼표로 구분)</label>
                        <input type="text" id="recipeTags" placeholder="한식, 반찬, 초간단" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">재료 및 조리 순서</label>
                        <textarea id="recipeContent" rows="5" required placeholder="재료: 계란 3개, 파...&#10;조리법: 1. 계란을 풀어줍니다..." class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:border-black"></textarea>
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50">취소</button>
                        <button type="submit" class="px-4 py-2 bg-black text-white rounded-lg text-sm font-medium hover:bg-gray-800">저장하기</button>
                    </div>
                </form>
            </div>

            <!-- Detail View inside Modal -->
            <div id="modalDetailView" class="hidden space-y-4">
                <div class="flex justify-between items-start">
                    <div>
                        <span id="detailMeta" class="text-xs text-gray-400 font-medium"></span>
                        <h3 id="detailTitle" class="text-xl font-bold mt-1"></h3>
                    </div>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-black text-xl">&times;</button>
                </div>
                <div id="detailImageContainer" class="rounded-xl overflow-hidden bg-gray-100 max-h-60">
                    <img id="detailImage" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div id="detailTags" class="flex flex-wrap gap-1.5"></div>
                <p id="detailDesc" class="text-sm text-gray-600"></p>
                <div class="border-t border-gray-100 pt-4">
                    <h4 class="text-xs font-semibold text-gray-400 mb-2">상세 레시피 및 조리법</h4>
                    <div id="detailContent" class="text-sm whitespace-pre-line bg-gray-50 p-4 rounded-xl leading-relaxed"></div>
                </div>
                <div class="flex justify-between pt-4 border-t border-gray-100">
                    <button id="deleteBtn" onclick="" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition">삭제하기</button>
                    <button onclick="closeModal()" class="px-4 py-2 bg-black text-white rounded-lg text-sm font-medium">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 사용자의 Firebase 설정 정보
        const firebaseConfig = {
          apiKey: "AIzaSyBzG6zCG7fZS02YE8AHDSSrZPV_kMcLN-U",
          authDomain: "recipe-book-d7652.firebaseapp.com",
          projectId: "recipe-book-d7652",
          storageBucket: "recipe-book-d7652.firebasestorage.app",
          messagingSenderId: "85558334227",
          appId: "1:85558334227:web:c31c01aa0a18b8a21c40e6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let recipes = [];
        let selectedTags = new Set();

        // 실시간 데이터 동기화 (Firestore onSnapshot)
        onSnapshot(collection(db, "recipes"), (snapshot) => {
            recipes = [];
            snapshot.forEach((docSnap) => {
                recipes.push({ id: docSnap.id, ...docSnap.data() });
            });
            render();
        }, (error) => {
            console.error("데이터 불러오기 실패:", error);
        });

        // 렌더링 함수
        window.render = function() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('recipeGrid');
            const emptyState = document.getElementById('emptyState');
            const countText = document.getElementById('recipeCountText');

            // 필터링 로직
            const filtered = recipes.filter(r => {
                const matchQuery = (r.title && r.title.toLowerCase().includes(searchQuery)) ||
                                   (r.content && r.content.toLowerCase().includes(searchQuery)) ||
                                   (r.tags && r.tags.some(t => t.toLowerCase().includes(searchQuery)));
                
                const matchTags = selectedTags.size === 0 || 
                                  (r.tags && Array.from(selectedTags).every(t => r.tags.includes(t)));
                
                return matchQuery && matchTags;
            });

            countText.innerText = `전체 목록 ${filtered.length}개`;
            grid.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'bg-white border border-gray-200 rounded-2xl overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col';
                    card.onclick = () => openDetail(r.id);

                    const imgHtml = r.image ? `<div class="h-48 overflow-hidden bg-gray-100"><img src="${r.image}" class="w-full h-full object-cover"></div>` : '';
                    
                    const tagsHtml = r.tags ? r.tags.map(t => `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">#${t}</span>`).join(' ') : '';

                    card.innerHTML = `
                        ${imgHtml}
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center text-xs text-gray-400 mb-1">
                                    <span>${r.meta || ''}</span>
                                </div>
                                <h3 class="font-bold text-lg mb-2">${r.title}</h3>
                                <p class="text-sm text-gray-600 line-clamp-2 mb-4">${r.desc || ''}</p>
                            </div>
                            <div class="flex flex-wrap gap-1.5 mt-auto pt-3 border-t border-gray-100">${tagsHtml}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            renderTagCloud();
        };

        // 태그 클라우드 렌더링
        function renderTagCloud() {
            const container = document.getElementById('tagFilterContainer');
            const tagCounts = {};
            recipes.forEach(r => {
                if (r.tags) {
                    r.tags.forEach(t => {
                        tagCounts[t] = (tagCounts[t] || 0) + 1;
                    });
                }
            });

            const tags = Object.keys(tagCounts);
            if (tags.length === 0) {
                container.innerHTML = '<span class="text-sm text-gray-400">등록된 태그가 없습니다.</span>';
                return;
            }

            container.innerHTML = '';
            tags.forEach(t => {
                const btn = document.createElement('button');
                const isSelected = selectedTags.has(t);
                btn.className = `text-xs px-3 py-1.5 rounded-lg font-medium transition ${isSelected ? 'bg-black text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.innerText = `#${t} (${tagCounts[t]})`;
                btn.onclick = () => {
                    if (isSelected) selectedTags.delete(t);
                    else selectedTags.add(t);
                    render();
                };
                container.appendChild(btn);
            });
        }

        // 레시피 저장 (Firestore 추가)
        window.saveRecipe = async function(e) {
            e.preventDefault();
            const title = document.getElementById('recipeTitle').value;
            const meta = document.getElementById('recipeMeta').value;
            const image = document.getElementById('recipeImage').value;
            const desc = document.getElementById('recipeDesc').value;
            const tagsInput = document.getElementById('recipeTags').value;
            const content = document.getElementById('recipeContent').value;

            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim().replace(/^#/, '')).filter(t => t.length > 0) : [];

            try {
                await addDoc(collection(db, "recipes"), {
                    title, meta, image, desc, tags, content, createdAt: serverTimestamp()
                });
                closeModal();
                document.getElementById('recipeForm').reset();
            } catch (err) {
                console.error("저장 오류:", err);
                alert("레시피 저장 중 오류가 발생했습니다.");
            }
        };

        // 레시피 삭제 (Firestore 삭제)
        window.deleteRecipe = async function(id) {
            if (confirm("정말 이 레시피를 삭제하시겠습니까?")) {
                try {
                    await deleteDoc(doc(db, "recipes", id));
                    closeModal();
                } catch (err) {
                    console.error("삭제 오류:", err);
                    alert("삭제 중 오류가 발생했습니다.");
                }
            }
        };

        // 모달 제어
        window.openModal = function() {
            document.getElementById('modalAddView').classList.remove('hidden');
            document.getElementById('modalDetailView').classList.add('hidden');
            document.getElementById('recipeModal').classList.remove('hidden');
            document.getElementById('recipeModal').classList.add('flex');
        };

        window.openDetail = function(id) {
            const r = recipes.find(item => item.id === id);
            if (!r) return;

            document.getElementById('modalAddView').classList.add('hidden');
            document.getElementById('modalDetailView').classList.remove('hidden');

            document.getElementById('detailTitle').innerText = r.title;
            document.getElementById('detailMeta').innerText = r.meta || '';
            document.getElementById('detailDesc').innerText = r.desc || '';
            document.getElementById('detailContent').innerText = r.content || '';
            
            const imgContainer = document.getElementById('detailImageContainer');
            const imgTag = document.getElementById('detailImage');
            if (r.image) {
                imgTag.src = r.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            const tagsContainer = document.getElementById('detailTags');
            tagsContainer.innerHTML = r.tags ? r.tags.map(t => `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-md">#${t}</span>`).join(' ') : '';

            document.getElementById('deleteBtn').setAttribute('onclick', `deleteRecipe('${r.id}')`);

            document.getElementById('recipeModal').classList.remove('hidden');
            document.getElementById('recipeModal').classList.add('flex');
        };

        window.closeModal = function() {
            document.getElementById('recipeModal').classList.remove('flex');
            document.getElementById('recipeModal').classList.add('hidden');
        };

        window.resetFilter = function() {
            document.getElementById('searchInput').value = '';
            selectedTags.clear();
            render();
        };
    </script>
</body>
</html>
